name: Quick JDK 25‑ea test

on:           # run only when you ask for it
  workflow_dispatch:

jobs:
  jdk25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin 25‑ea
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25-ea'

      - name: Show Java version
        run: java -version
